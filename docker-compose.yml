version: "3.8"

services:
  login-mysql-db:
    image: mysql:8.0
    container_name: login-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: login_db
      TZ: Asia/Seoul
    volumes:
      - login_mysql_data:/var/lib/mysql
    networks:
      - clip-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5

  crud-mysql-db:
    image: mysql:8.0
    container_name: crud-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: crud_db
      TZ: Asia/Seoul
    volumes:
      - crud_mysql_data:/var/lib/mysql
    networks:
      - clip-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5

  tagging-mysql-db:
    image: mysql:8.0
    container_name: tagging-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: tagging_db
      TZ: Asia/Seoul
    volumes:
      - tagging_mysql_data:/var/lib/mysql
    networks:
      - clip-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5

  monitoring-mysql-db:
    image: mysql:8.0
    container_name: monitoring-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: monitoring_db
      TZ: Asia/Seoul
    volumes:
      - monitoring_mysql_data:/var/lib/mysql
    networks:
      - clip-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5

  login-redis-cache:
    image: redis:7.0-alpine
    container_name: login-redis
    networks:
      - clip-net

  crud-redis-cache:
    image: redis:7.0-alpine
    container_name: crud-redis
    networks:
      - clip-net

  tagging-redis-cache:
    image: redis:7.0-alpine
    container_name: tagging-redis
    networks:
      - clip-net

  embedding-redis-cache:
    image: redis:7.0-alpine
    container_name: embedding-redis
    networks:
      - clip-net

  monitoring-redis-cache:
    image: redis:7.0-alpine
    container_name: monitoring-redis
    networks:
      - clip-net

  rabbitmq-broker:
    image: rabbitmq:3.12-management
    container_name: clip-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - clip-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping", "-q"]
      interval: 10s
      timeout: 5s
      retries: 5

  login-service:
    build:
      context: ./login-service
    container_name: login-service
    environment:
      DATABASE_URL: login-mysql-db/login_db
      REDIS_HOST: login-redis-cache
    depends_on:
      login-mysql-db:
        condition: service_healthy
      login-redis-cache:
        condition: service_started
    networks:
      - clip-net

  crud-service:
    build:
      context: ./crud-service
    container_name: crud-service
    environment:
      DATABASE_URL: crud-mysql-db/crud_db
      RABBITMQ_HOST: rabbitmq-broker
      REDIS_HOST: crud-redis-cache
    depends_on:
      crud-mysql-db:
        condition: service_healthy
      crud-redis-cache:
        condition: service_started
      rabbitmq-broker:
        condition: service_started
    networks:
      - clip-net

  tagging-service:
    build:
      context: ./tagging-service
    container_name: tagging-service
    environment:
      DATABASE_URL: tagging-mysql-db/tagging_db
      RABBITMQ_HOST: rabbitmq-broker
      REDIS_HOST: tagging-redis-cache
    depends_on:
      tagging-mysql-db:
        condition: service_healthy
      tagging-redis-cache:
        condition: service_started
      rabbitmq-broker:
        condition: service_started
    networks:
      - clip-net

  embedding-service:
    build:
      context: ./embedding-service
    container_name: embedding-service
    environment:
      RABBITMQ_HOST: rabbitmq-broker
      REDIS_HOST: embedding-redis-cache
      # PINECONE_API_KEY: ${PINECONE_API_KEY}
    depends_on:
      embedding-redis-cache:
        condition: service_started
      rabbitmq-broker:
        condition: service_started
    networks:
      - clip-net

  monitoring-service:
    build:
      context: ./monitoring-service
    container_name: monitoring-service
    environment:
      DATABASE_URL: monitoring-mysql-db/monitoring_db
      RABBITMQ_HOST: rabbitmq-broker
      REDIS_HOST: monitoring-redis-cache
    depends_on:
      monitoring-mysql-db:
        condition: service_healthy
      monitoring-redis-cache:
        condition: service_started
      rabbitmq-broker:
        condition: service_started
    networks:
      - clip-net
  nginx-gateway:
    image: nginx:stable-alpine
    container_name: clip-api-gateway
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - clip-net
    depends_on:
      - login-service
      - crud-service

volumes:
  login_mysql_data:
  crud_mysql_data:
  tagging_mysql_data:
  monitoring_mysql_data:

networks:
  clip-net:
    driver: bridge
