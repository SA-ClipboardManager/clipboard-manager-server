services:
  adminer:
    image: adminer
    container_name: clip-adminer
    restart: always
    ports:
      - "8081:8080"
    networks:
      - clip-net
  login-mysql-db:
    image: mysql:8.0
    container_name: login-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: login_db
      TZ: Asia/Seoul
    volumes:
      - login_mysql_data:/var/lib/mysql
    networks:
      - clip-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5

  crud-mysql-db:
    image: mysql:8.0
    container_name: crud-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: crud_db
      TZ: Asia/Seoul
    volumes:
      - crud_mysql_data:/var/lib/mysql
    networks:
      - clip-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5

  tagging-mysql-db:
    image: mysql:8.0
    container_name: tagging-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: tagging_db
      TZ: Asia/Seoul
    volumes:
      - tagging_mysql_data:/var/lib/mysql
    networks:
      - clip-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5

  # monitoring-mysql-db:
  #   image: mysql:8.0
  #   container_name: monitoring-mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
  #     MYSQL_DATABASE: monitoring_db
  #     TZ: Asia/Seoul
  #   volumes:
  #     - monitoring_mysql_data:/var/lib/mysql
  #   networks:
  #     - clip-net
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 5s
  #     timeout: 10s
  #     retries: 5

  login-redis-cache:
    image: redis:7.0-alpine
    container_name: login-redis
    networks:
      - clip-net

  crud-redis-cache:
    image: redis:7.0-alpine
    container_name: crud-redis
    networks:
      - clip-net

  tagging-redis-cache:
    image: redis:7.0-alpine
    container_name: tagging-redis
    networks:
      - clip-net

  embedding-redis-cache:
    image: redis:7.0-alpine
    container_name: embedding-redis
    networks:
      - clip-net

  # monitoring-redis-cache:
  #   image: redis:7.0-alpine
  #   container_name: monitoring-redis
  #   networks:
  #     - clip-net

  rabbitmq-broker:
    image: rabbitmq:3.12-management
    container_name: clip-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "15672:15672"
    networks:
      - clip-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping", "-q"]
      interval: 10s
      timeout: 5s
      retries: 5

  login-service:
    build:
      context: ./login-service
    container_name: login-service
    env_file:
      - .env
    environment:
      DB_HOST: login-mysql-db
      DATABASE_URL: login-mysql-db/login_db
      REDIS_HOST: login-redis-cache
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: login_db
    depends_on:
      login-mysql-db:
        condition: service_healthy
      login-redis-cache:
        condition: service_started
    networks:
      - clip-net
    ports:
      - "9001:8000"

  crud-service:
    build:
      context: ./crud-service
    container_name: crud-service
    env_file:
      - .env
    environment:
      DB_HOST: crud-mysql-db
      DATABASE_URL: crud-mysql-db/crud_db
      RABBITMQ_HOST: rabbitmq-broker
      REDIS_HOST: crud-redis-cache
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: crud_db
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    volumes:
      - ./my_local_images:/app/shared_images
    depends_on:
      crud-mysql-db:
        condition: service_healthy
      crud-redis-cache:
        condition: service_started
      rabbitmq-broker:
        condition: service_healthy
    networks:
      - clip-net

  tagging-service:
    build:
      context: ./tagging-service
    container_name: tagging-service
    env_file:
      - .env
    environment:
      DB_HOST: tagging-mysql-db
      DATABASE_URL: tagging-mysql-db/tagging_db
      RABBITMQ_HOST: rabbitmq-broker
      REDIS_HOST: tagging-redis-cache
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: tagging_db
    volumes:
      - ./my_local_images:/app/shared_images
    depends_on:
      tagging-mysql-db:
        condition: service_healthy
      tagging-redis-cache:
        condition: service_started
      rabbitmq-broker:
        condition: service_healthy
    networks:
      - clip-net

  embedding-service:
    build:
      context: ./embedding-service
    container_name: embedding-service
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq-broker
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq-broker:5672/
      RABBITMQ_IMAGE_QUEUE: embedding_image_queue
      REDIS_HOST: embedding-redis-cache
      # PINECONE_API_KEY: ${PINECONE_API_KEY}
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - ./my_local_images:/app/shared_images
    depends_on:
      embedding-redis-cache:
        condition: service_started
      rabbitmq-broker:
        condition: service_healthy
    networks:
      - clip-net

  # monitoring-service:
  #   build:
  #     context: ./monitoring-service
  #   container_name: monitoring-service
  #   env_file:
  #     - .env
  #   environment:
  #     DB_HOST: monitoring-mysql-db
  #     RABBITMQ_HOST: rabbitmq-broker
  #     REDIS_HOST: monitoring-redis-cache
  #     DB_PASSWORD: ${DB_ROOT_PASSWORD}
  #     SECRET_KEY: ${SECRET_KEY}
  #     DB_NAME: monitoring_db
  #   volumes:
  #     - shared_images:/app/shared_images
  #   depends_on:
  #     monitoring-mysql-db:
  #       condition: service_healthy
  #     monitoring-redis-cache:
  #       condition: service_started
  #     rabbitmq-broker:
  #       condition: service_healthy
  #   networks:
  #     - clip-net
  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq-broker
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    volumes:
      - ./my_local_images:/app/shared_images
    depends_on:
      rabbitmq-broker:
        condition: service_healthy
    networks:
      - clip-net
  nginx-gateway:
    image: nginx:stable-alpine
    container_name: clip-api-gateway
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8576:80"
    networks:
      - clip-net
    restart: always
    depends_on:
      - login-service
      - crud-service
      - notification-service
      - embedding-service
      - tagging-service
      # - monitoring-service

volumes:
  login_mysql_data:
  crud_mysql_data:
  tagging_mysql_data:
  # monitoring_mysql_data:
  shared_images:
    driver: local

networks:
  clip-net:
    driver: bridge
