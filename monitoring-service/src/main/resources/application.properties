spring.application.name=monitoring-service

spring.jackson.property-naming-strategy=SNAKE_CASE

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# DB
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# rabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# 1. ?? ?? ?? ? ?? (?? ?? ??? logs ?? ?? ???)
logging.file.name=logs/monitoring-service.log

# 2. ?? ?? ??? ?? ?? (? ??? ??? ???? ? ?? ??)
logging.logback.rollingpolicy.max-file-size=10MB

# 3. ?? ?? ?? ?? (? ??, 7? ?? ??? ??)
logging.logback.rollingpolicy.max-history=7

# 4. ?? ?? ?? ?? ?? (?? ?? 1GB ??? ??? ??? ??)
logging.logback.rollingpolicy.total-size-cap=1GB
