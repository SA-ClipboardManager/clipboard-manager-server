# nginx.conf

events { worker_connections 1024; }

http {
    
    upstream login_service {
        server login-service:8000; 
    }
    upstream crud_service {
        server crud-service:8000;
    }
    upstream embedding_service {
        server embedding-service:8000;
    }
    upstream tagging_service {
        server tagging-service:8000;
    }
    upstream monitoring_service {
        server monitoring-service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /auth/v1/ {
            rewrite ^/auth/v1/(.*)$ /$1 break;
            proxy_pass http://login_service;
        }

        location /api/v1/ {
            rewrite ^/api/v1/(.*)$ /$1 break;
            proxy_pass http://crud_service;
        }

        location /search/v1/ {
            rewrite ^/search/v1/(.*)$ /$1 break;
            proxy_pass http://embedding_service;
        }

        location /metrics {
            proxy_pass http://monitoring_service;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            return 500 "Service Unavailable.";
        }
        
        location / {
            return 404 "API Endpoint Not Found.";
        }
    }
}