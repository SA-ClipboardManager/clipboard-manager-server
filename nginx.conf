# nginx.conf

events { worker_connections 1024; }

http {
    # Docker의 내부 DNS resolver 사용
    resolver 127.0.0.11 valid=30s;

    # 클라이언트 요청 바디 크기 제한 (이미지 업로드용)
    client_max_body_size 10M;

    server {
        listen 80;
        server_name localhost;

        # 변수를 사용하여 동적 DNS 조회 강제
        set $login_upstream http://login-service:8000;
        set $crud_upstream http://crud-service:8000;
        set $embedding_upstream http://embedding-service:8000;
        set $tagging_upstream http://tagging-service:8000;
        set $notification_upstream http://notification-service:8000;
        set $monitoring_upstream http://monitoring-service:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 인증 검증 로직 (Gateway Offloading)
        location = /_auth_verify {
            internal; 
            proxy_pass $login_upstream/api/v1/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # 로그인 및 회원가입 - MUST come before /api/v1/ block
        location /api/v1/auth/register {
            proxy_pass $login_upstream/api/v1/auth/signup;
        }
        
        location /api/v1/auth/login {
            proxy_pass $login_upstream/api/v1/auth/login;
        }
        
        location /api/v1/auth/refresh {
            proxy_pass $login_upstream/api/v1/auth/refresh;
        }
        # CRUD 서비스
        location /api/v1/ {
            auth_request /_auth_verify;

            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $max_count $upstream_http_x_max_count_cloud;

            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-Max-Count-Cloud $max_count;

            rewrite ^/api/v1/(.*)$ /$1 break;
            proxy_pass $crud_upstream;
        }
        
        # 정적 파일 (이미지) 서빙
        location /local/ {
            auth_request /_auth_verify;
            
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-ID $user_id;
            
            proxy_pass $crud_upstream;
        }
        
        location = /sync/events {
            auth_request /_auth_verify;

            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $max_count $upstream_http_x_max_count_cloud;

            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-Max-Count-Cloud $max_count;

            # rewrite 필요 없음 - 백엔드 경로와 동일
            proxy_pass $crud_upstream;
        }
                

        # 검색 서비스
        location /search/v1/ {
            auth_request /_auth_verify;

            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-ID $user_id;

            rewrite ^/search/v1/(.*)$ /$1 break;
            proxy_pass $embedding_upstream;
        }
        # WebSocket
        location /ws/ {
            # WebSocket은 auth_request와 호환되지 않으므로 
            # notification-service에서 직접 토큰 검증
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Authorization $http_authorization;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_pass $notification_upstream;
        }

        location /metrics {
            proxy_pass $monitoring_upstream/metrics;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            return 500 "Service Unavailable.";
        }
        
        location / {
            return 404 "API Endpoint Not Found.";
        }
    }
}