name: Sonar Analysis (Monitoring - Java)

on:
  push:
    branches: [ "main" ]
    paths: [ "monitoring-service/**" ] # 모니터링 폴더 바뀔 때만 실행
  pull_request:
    paths: [ "monitoring-service/**" ]

jobs:
  scan-monitoring:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./monitoring-service # 작업 위치를 여기로 고정

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 실행 권한 부여 및 빌드 + 스캔 한번에 실행
      - name: Build and Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew build sonar \
            -Dsonar.organization=sa-clipboardmanager \
            -Dsonar.projectKey=sa-clipboardmanager_clipboard-manager-monitoring